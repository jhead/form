# Xcode project definition. Generated with `make xcode`; the .xcodeproj is not committed,
# because a generated project cannot conflict and SwiftPM stays the source of truth.
#
# The app target compiles app/Sources/form and links the package's library products, so
# there is exactly one copy of every source file. A pre-build phase builds the Rust static
# library, and LIBRARY_SEARCH_PATHS points the linker at it — the `link "form_ffi"` directive
# in Sources/FormFFI/module.modulemap supplies the -l.

name: form
options:
  bundleIdPrefix: dev.jhead
  createIntermediateGroups: true
  deploymentTarget:
    macOS: "14.0"
  minimumXcodeGenVersion: "2.40"

settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    # Local, unsigned development build. Signing is a shipping concern, not an MVP one.
    CODE_SIGN_IDENTITY: "-"
    CODE_SIGN_STYLE: Manual
    DEVELOPMENT_TEAM: ""
    ENABLE_HARDENED_RUNTIME: NO
    ENABLE_USER_SCRIPT_SANDBOXING: NO
  configs:
    Debug:
      FORM_RUST_PROFILE: debug
      ONLY_ACTIVE_ARCH: YES
    Release:
      FORM_RUST_PROFILE: release

packages:
  form:
    path: app

targets:
  form:
    type: application
    platform: macOS
    sources:
      - path: app/Sources/form
    dependencies:
      - package: form
        product: FormUI
      - package: form
        product: FormCore
      - package: form
        product: FormDesign
      - package: form
        product: FormMarkdown
    settings:
      base:
        PRODUCT_NAME: form
        PRODUCT_BUNDLE_IDENTIFIER: dev.jhead.form
        INFOPLIST_FILE: app/Resources/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        LIBRARY_SEARCH_PATHS:
          - $(inherited)
          - $(SRCROOT)/core/target/$(FORM_RUST_PROFILE)
    preBuildScripts:
      - name: Build Rust core
        script: |
          "$SRCROOT/scripts/build-core.sh" "$FORM_RUST_PROFILE"
        # The Rust build has its own dependency tracking; letting Xcode skip it on the basis
        # of file lists would miss changes under core/.
        basedOnDependencyAnalysis: false

schemes:
  form:
    build:
      targets:
        form: all
    run:
      config: Debug
    profile:
      config: Release
    archive:
      config: Release
