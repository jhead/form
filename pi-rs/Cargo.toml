[workspace]
resolver = "2"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
license = "MIT"
# The port derives from https://github.com/earendil-works/pi. `homepage` points
# there rather than `repository`, which is meant to be *this* package's repo.
homepage = "https://github.com/earendil-works/pi"
description = "Rust port of the Pi agent harness SDK"

[workspace.dependencies]
# --- internal ---
pi-core = { path = "crates/pi-core", version = "0.1.0" }
pi-telemetry = { path = "crates/pi-telemetry", version = "0.1.0" }
pi-http = { path = "crates/pi-http", version = "0.1.0" }
pi-catalog = { path = "crates/pi-catalog", version = "0.1.0" }
pi-auth = { path = "crates/pi-auth", version = "0.1.0" }
pi-provider-common = { path = "crates/pi-provider-common", version = "0.1.0" }
pi-provider-anthropic = { path = "crates/pi-provider-anthropic", version = "0.1.0" }
pi-provider-openai = { path = "crates/pi-provider-openai", version = "0.1.0" }
pi-provider-google = { path = "crates/pi-provider-google", version = "0.1.0" }
pi-provider-misc = { path = "crates/pi-provider-misc", version = "0.1.0" }
pi-tools = { path = "crates/pi-tools", version = "0.1.0" }
pi-session = { path = "crates/pi-session", version = "0.1.0" }
pi-session-sqlite = { path = "crates/pi-session-sqlite", version = "0.1.0" }
pi-agent = { path = "crates/pi-agent", version = "0.1.0" }
pi-protocol = { path = "crates/pi-protocol", version = "0.1.0" }
pi-client = { path = "crates/pi-client", version = "0.1.0" }
pi-server = { path = "crates/pi-server", version = "0.1.0" }

# --- external (pinned minor, like upstream's exact-pin policy) ---
async-trait = "0.1"
base64 = "0.22"
bytes = "1"
chrono = { version = "0.4", default-features = false, features = ["clock", "std", "serde"] }
dashmap = "6"
futures = "0.3"
futures-core = "0.3"
futures-util = "0.3"
globset = "0.4"
hmac = "0.12"
ignore = "0.4"
indexmap = { version = "2", features = ["serde"] }
jsonschema = { version = "0.26", default-features = false }
libc = "0.2"
notify = "7"
once_cell = "1"
parking_lot = "0.12"
percent-encoding = "2"
pin-project-lite = "0.2"
rand = "0.8"
regex = "1"
reqwest = { version = "0.12", default-features = false, features = [
    "rustls-tls",
    "json",
    "stream",
    "charset",
    "http2",
] }
rsa = { version = "0.9", default-features = false, features = ["std", "pem", "sha2"] }
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order", "raw_value"] }
# Frontmatter in skills and prompt templates. Upstream uses the `yaml` package
# (full YAML 1.2), so a key/value splitter would reject valid frontmatter.
# `serde_norway` is the maintained fork of the archived `serde_yaml`.
serde_norway = "0.9"
sha1 = "0.10"
sha2 = "0.10"
similar = "2"
tempfile = "3"
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "fs", "io-util", "process", "net", "signal"] }
tokio-stream = { version = "0.1", features = ["sync"] }
tokio-tungstenite = { version = "0.24", features = ["rustls-tls-webpki-roots"] }
tokio-util = { version = "0.7", features = ["io"] }
tracing = "0.1"
unicode-normalization = "0.1"
url = "2"
uuid = { version = "1", features = ["v4", "v7", "serde"] }

# dev
insta = { version = "1", features = ["json"] }
pretty_assertions = "1"
wiremock = "0.6"

[profile.release]
lto = "thin"
codegen-units = 1
