[workspace]
resolver = "2"
members = ["crates/form-core", "crates/form-ffi", "crates/form-cli"]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
license = "MIT"

[workspace.dependencies]
form-core = { path = "crates/form-core" }
form-ffi = { path = "crates/form-ffi" }

serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
async-trait = "0.1"
tokio = { version = "1", features = ["rt-multi-thread", "sync", "time", "macros"] }
tokio-stream = "0.1"
futures-core = "0.3"
futures-util = "0.3"
uuid = { version = "1", features = ["v4", "fast-rng"] }
chrono = { version = "0.4", default-features = false, features = ["std", "clock"] }
chrono-tz = "0.10"
rusqlite = { version = "0.32", features = ["bundled"] }
pulldown-cmark = { version = "0.12", default-features = false, features = ["html"] }
syntect = { version = "5", default-features = false, features = ["default-fancy"] }
# syntect's bundled set has no Swift, TypeScript, TOML, Kotlin or Dockerfile grammar. For a
# Swift coding-agent client, unhighlighted Swift is a visible miss; two-face carries bat's
# curated syntax dump. Feature must track syntect's regex engine above.
two-face = { version = "0.4", default-features = false, features = ["syntect-default-fancy"] }
rand = "0.8"
rand_chacha = "0.3"
sha2 = "0.10"
base64 = "0.22"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[profile.release]
lto = "thin"
codegen-units = 1
