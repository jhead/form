# Generates core/include/form.h. Run `make headers`, or let `cargo test -p form-ffi` tell you
# the header has drifted.
#
# The Swift package's module map (app/Sources/FormFFI/module.modulemap) includes the
# generated header directly, so the names here are the names Swift sees. Do not rename.

language = "C"
header = """/*
 * form — C ABI over form-core.
 *
 * GENERATED by cbindgen from core/crates/form-ffi. Do not edit by hand: run `make headers`
 * and commit the result. `cargo test -p form-ffi` fails if this file has drifted.
 *
 * Contract (docs/specs/00-protocol.md):
 *   - Every payload is UTF-8 JSON. Nothing else crosses this boundary.
 *   - Strings returned by form_core_query / form_core_dispatch are owned by the caller and
 *     must be released with form_string_free.
 *   - Events are delivered on one dedicated thread, in order, never concurrently. The
 *     callback must not re-enter the core.
 */"""
include_guard = "FORM_H"
no_includes = true
sys_includes = ["stdint.h", "stddef.h"]
cpp_compat = true
usize_is_size_t = true
documentation = true
documentation_style = "c"
line_length = 96
tab_width = 4
style = "type"
sort_by = "None"

[parse]
parse_deps = false

[export]
include = ["FormCoreHandle", "FormEventCallback"]

[fn]
sort_by = "None"

[const]
allow_static_const = false
allow_constexpr = false
